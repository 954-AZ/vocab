<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆曲线背单词</title>
<style>
body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f5f6fa;margin:0;color:#222}
.wrap{max-width:560px;margin:0 auto;padding:20px}
h1{font-size:22px;text-align:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.tabs button,.btn{border:0;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;background:#e3e6ef}
.tabs button.on{background:#3b6cf6;color:#fff}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 10px #0001;text-align:center;min-height:180px}
.word{font-size:34px;font-weight:600;margin:10px 0}
.mean{font-size:20px;color:#444;margin:16px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.bad{background:#f8d7da}.mid{background:#fff3cd}.good{background:#d4edda}
textarea{width:100%;height:160px;border-radius:10px;border:1px solid #ccc;padding:10px;font-size:15px;box-sizing:border-box}
.stat{display:flex;justify-content:space-around;margin:12px 0;color:#555}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px;border-bottom:1px solid #eee}
.hidden{display:none}
</style></head><body><div class="wrap">
<h1>📚 记忆曲线背单词</h1>
<div class="tabs"><button data-t="study" class="on">今日复习</button><button data-t="add">添加单词</button><button data-t="list">词库</button></div>
<div class="stat"><span>今日待复习：<b id="due">0</b></span><span>词库总数：<b id="total">0</b></span></div>

<div id="study"><div class="card" id="card"></div></div>

<div id="add" class="hidden"><div class="card" style="text-align:left">
<p>每行一个单词，格式：<code>单词 中文意思</code>（用空格或逗号隔开）</p>
<textarea id="input" placeholder="abandon 放弃&#10;ability 能力&#10;absorb, 吸收"></textarea>
<div class="row"><button class="btn good" id="addBtn">加入词库</button><button class="btn" id="demo">导入示例词</button></div>
<p id="msg"></p></div></div>

<div id="list" class="hidden"><div class="card" style="text-align:left"><table id="tbl"></table>
<div class="row"><button class="btn" id="exp">导出备份</button><button class="btn" id="imp">导入备份</button><button class="btn bad" id="clr">清空词库</button></div></div></div>
</div>
<script>
// 艾宾浩斯复习间隔（天）
const GAPS=[0,1,2,4,7,15,30,60];
const DAY=86400000;
let words=JSON.parse(localStorage.getItem('vocab')||'[]');
const save=()=>{localStorage.setItem('vocab',JSON.stringify(words));render()};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const dueList=()=>words.filter(w=>w.next<=today()+DAY-1);
let showing=false,cur=null;
function render(){
 document.getElementById('due').textContent=dueList().length;
 document.getElementById('total').textContent=words.length;
 const c=document.getElementById('card'),d=dueList();
 if(!words.length){c.innerHTML='<p>词库还是空的，先去「添加单词」吧。</p>';}
 else if(!d.length){c.innerHTML='<p style="font-size:20px">🎉 今天的复习全部完成！</p><p>明天再来。</p>';}
 else{ if(!cur||!d.includes(cur)){cur=d[Math.floor(Math.random()*d.length)];showing=false}
  c.innerHTML=`<div style="color:#999">第 ${cur.stage+1} 轮</div><div class="word">${cur.w}</div>`+
  (showing?`<div class="mean">${cur.m}</div><div class="row"><button class="btn bad" onclick="ans(0)">忘了</button><button class="btn mid" onclick="ans(1)">模糊</button><button class="btn good" onclick="ans(2)">记得</button></div>`
  :`<div class="row"><button class="btn" onclick="showing=true;render()">显示意思</button><button class="btn" onclick="speak()">🔊 发音</button></div>`);}
 const t=document.getElementById('tbl');
 t.innerHTML='<tr><td><b>单词</b></td><td><b>意思</b></td><td><b>下次复习</b></td></tr>'+words.map(w=>`<tr><td>${w.w}</td><td>${w.m}</td><td>${new Date(w.next).toLocaleDateString('zh-CN')}</td></tr>`).join('');
}
function ans(q){
 if(q===0)cur.stage=0; else if(q===2)cur.stage=Math.min(cur.stage+1,GAPS.length-1);
 cur.next=today()+(q===0?0:GAPS[cur.stage]||1)*DAY + (q===0?0:0);
 if(q===0) cur.next=today(); // 忘了：今天再来
 cur=null;save();
}
function speak(){const u=new SpeechSynthesisUtterance(cur.w);u.lang='en-US';speechSynthesis.speak(u)}
function addText(txt){let n=0;txt.split('\n').forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^([A-Za-z][A-Za-z\-' ]*?)[\s,，]+(.+)$/);if(!m)return;
 if(words.some(x=>x.w.toLowerCase()===m[1].toLowerCase()))return;words.push({w:m[1].trim(),m:m[2].trim(),stage:0,next:today()});n++});save();return n}
document.getElementById('addBtn').onclick=()=>{const n=addText(input.value);msg.textContent=`已添加 ${n} 个单词`;input.value=''};
document.getElementById('demo').onclick=()=>{const n=addText("abandon 放弃\nability 能力\nabsorb 吸收\nabstract 抽象的\nacademic 学术的\naccelerate 加速\naccess 进入；使用权\naccommodate 容纳；适应\naccompany 陪伴\naccumulate 积累");msg.textContent=`已导入 ${n} 个示例词`};
document.getElementById('clr').onclick=()=>{if(confirm('确定清空全部单词？')){words=[];save()}};
document.getElementById('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(words)]));a.download='单词备份.json';a.click()};
document.getElementById('imp').onclick=()=>{const i=document.createElement('input');i.type='file';i.onchange=()=>i.files[0].text().then(t=>{words=JSON.parse(t);save()});i.click()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['study','add','list'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.t))});
render();
</script></body></html>
